name: Build MiniMacro

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android 64-bit Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: latest

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniMacro-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
